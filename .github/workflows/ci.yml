name: ci
on:
  push:
  pull_request:
jobs:
  test:
    if: github.repository == 'kube-ar/ground-stop'  # your copy's CI stays quiet: your code changes the starters
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check
      - run: uv run pytest -q
