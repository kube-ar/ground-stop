[project]
name = "ground-stop"
version = "0.1.0"
description = "Todos en tierra: a storm closes the hub; build the agent mesh that rehouses every stranded passenger by 06:00."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "pydantic>=2.8",
    "pyjwt>=2.9",
]

[project.scripts]
ground-stop = "groundstop.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundstop"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
