# `docker compose up` replays night p1 with the naive mesh and prints the scoreboard.
# Other commands: `docker compose run --rm ground-stop show p1`, `... replay s2 --mesh my_mesh`.
# The repo is mounted, so your code and the logs in runs/ live on your machine.
services:
  ground-stop:
    build: .
    volumes:
      - .:/app
    environment:
      GROUND_STOP_LANG: ${GROUND_STOP_LANG:-es}
    command: ["replay"]
